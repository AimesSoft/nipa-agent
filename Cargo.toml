[package]
name = "nipa-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Minimal tool-calling agent runtime for AI media scraping, speaking OpenAI-compatible Chat Completions"
repository = "https://github.com/AimesSoft/nipa-agent"
homepage = "https://github.com/AimesSoft/nipa-agent"
readme = "README.md"
rust-version = "1.88"
keywords = ["agent", "tool-calling", "llm", "openai"]
categories = ["api-bindings"]

[dependencies]
fastrand = "2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
